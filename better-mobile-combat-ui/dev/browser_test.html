<script>
class TreeCard extends HTMLElement {
  constructor() {
    super();
    this._content = document.getElementById('tree-template').content.cloneNode(true);
    this.name = this._content.querySelector('.name');
    this.bar = this._content.querySelector('.progress-bar');
    this.button = this._content.querySelector('.cut');
    this.clicks = 0;
    this.button.onclick = () => this.clicks++;
  }
  connectedCallback() { this.appendChild(this._content); }
}
customElements.define('tree-card', TreeCard);
class FishButton extends HTMLElement {
  connectedCallback() { if (!this.textContent) this.textContent = this.dataset.fish; }
}
customElements.define('fish-button', FishButton);
class AreaCard extends HTMLElement {
  constructor() {
    super();
    this._content = document.getElementById('area-template').content.cloneNode(true);
    this.buttonContainer = this._content.querySelector('.buttons');
    this.fishName = this._content.querySelector('.fish-name');
    this.fishButtons = [];
  }
  connectedCallback() { this.appendChild(this._content); }
  setFish(fish) {
    this.buttonContainer.textContent = '';
    this.fishButtons = fish.map((name) => {
      const button = document.createElement('fish-button');
      button.dataset.fish = name;
      this.buttonContainer.append(button);
      return button;
    });
  }
}
customElements.define('area-card', AreaCard);
class NpcNav extends HTMLElement {
  connectedCallback() { if (!this.textContent) this.textContent = this.dataset.npc; }
}
customElements.define('npc-nav', NpcNav);
class PanelCard extends HTMLElement {
  constructor() {
    super();
    this._content = document.getElementById('panel-template').content.cloneNode(true);
    this.targetContainer = this._content.querySelector('.targets');
    this.infoSkillName = this._content.querySelector('.info-skill-name');
    this.npcNavs = new Map();
  }
  connectedCallback() { this.appendChild(this._content); }
  setArea(area) {
    for (const npc of area.npcs) {
      const nav = document.createElement('npc-nav');
      nav.dataset.npc = npc.id;
      this.targetContainer.append(nav);
      this.npcNavs.set(npc, nav);
    }
  }
}
customElements.define('panel-card', PanelCard);
const getTemplateNode = (id) => document.getElementById(id).content.cloneNode(true);
const getElementFromFragment = (fragment, id) => {
  const element = fragment.getElementById(id);
  element.removeAttribute('id');
  return element;
};
class CategoryMenuOptionElement extends HTMLElement {
  constructor() {
    super();
    this._content = new DocumentFragment();
    this._content.append(getTemplateNode('category-menu-option-template'));
    this.link = getElementFromFragment(this._content, 'link');
    this.image = getElementFromFragment(this._content, 'image');
    this.name = getElementFromFragment(this._content, 'name');
  }
  connectedCallback() { this.appendChild(this._content); }
  setOption(option, callbackFn) {
    this.link.onclick = () => callbackFn();
    this.image.src = option.media;
    this.name.textContent = option.name;
  }
  highlight() { this.link.classList.add('bg-combat-menu-selected'); }
  unhighlight() { this.link.classList.remove('bg-combat-menu-selected'); }
}
customElements.define('category-menu-option', CategoryMenuOptionElement);
class CategoryMenuElement extends HTMLElement {
  constructor() {
    super();
    this.options = new Map();
    this._content = new DocumentFragment();
    this._content.append(getTemplateNode('category-menu-template'));
    this.expandButton = getElementFromFragment(this._content, 'expand-button');
    this.expandText = getElementFromFragment(this._content, 'expand-text');
    this.expandDiv = getElementFromFragment(this._content, 'expand-div');
    this.optionsContainer = getElementFromFragment(this._content, 'options-container');
    this.expandButton.onclick = () => this.expandDiv.classList.toggle('d-none');
  }
  connectedCallback() { this.appendChild(this._content); }
  addOptions(options, expandText, callbackFn) {
    this.expandText.textContent = expandText;
    options.forEach((option) => {
      const newOption = new CategoryMenuOptionElement();
      newOption.setOption(option, () => { callbackFn(option); this.expandDiv.classList.add('d-none'); });
      this.optionsContainer.append(newOption);
      this.options.set(option, newOption);
    });
  }
  highlightOption(option) { this.options.get(option)?.highlight(); }
  unhighlightOption(option) { this.options.get(option)?.unhighlight(); }
  hideCategory(category) { this.options.get(category)?.classList.add('d-none'); }
  showCategory(category) { this.options.get(category)?.classList.remove('d-none'); }
}
customElements.define('category-menu', CategoryMenuElement);
const areaFights = [];
const langStrings = { MENU_TEXT_AREA_INFO: 'Area Info', MENU_TEXT_VIEW_MONSTER_LIST: 'View Monster List', MENU_TEXT_VIEW_COMBAT_TRIANGLE: 'View Combat Triangle', VIEW_ON_OFFICIAL_WIKI: 'View on Wiki', COMBAT_MISC_48: 'Requires:', COMBAT_MISC_HERE: 'Here' };
customElements.define('lang-string', class extends HTMLElement { connectedCallback() { this.textContent = langStrings[this.getAttribute('lang-id')] ?? ''; } });
class CombatAreaMenuElement extends HTMLElement {
  constructor() {
    super();
    this.isOpen = false;
    this._content = new DocumentFragment();
    this._content.append(getTemplateNode('combat-area-menu-template'));
    this.openButton = getElementFromFragment(this._content, 'open-button');
    this.image = getElementFromFragment(this._content, 'image');
    this.lockedContainer = getElementFromFragment(this._content, 'locked-container');
    this.unlockedContainer = getElementFromFragment(this._content, 'unlocked-container');
    this.areaName = getElementFromFragment(this._content, 'area-name');
    this.minDifficultyBadge = getElementFromFragment(this._content, 'min-difficulty-badge');
    this.entryRequirements = getElementFromFragment(this._content, 'entry-requirements');
    this.openOptions = getElementFromFragment(this._content, 'open-options');
  }
  connectedCallback() { this.appendChild(this._content); }
  setArea(area) {
    this.openButton.onclick = () => this.toggleOptions(area);
    this.image.src = area.media;
    this.areaName.textContent = area.name;
    this.minDifficultyBadge.textContent = 'Easy';
    this.minDifficultyBadge.classList.add('badge-success');
    this.entryRequirements.innerHTML = `<li><span class="text-success">Level ${area.name.length}</span></li>`;
    this.lockedContainer.querySelector('.font-w600').textContent = `Complete ${area.name} trials to unlock`;
    this.lockedContainer.classList.toggle('d-none', !area.locked);
    this.unlockedContainer.classList.toggle('d-none', area.locked);
    for (const monster of area.monsters) {
      const row = Object.assign(document.createElement('div'), { className: 'monster-row d-flex justify-content-between' });
      const fight = Object.assign(document.createElement('button'), { className: 'btn btn-sm btn-danger area-fight', textContent: 'Fight' });
      fight.onclick = (event) => {
        areaFights.push(`${monster} in ${area.id}`);
        event.stopPropagation();
      };
      row.append(Object.assign(document.createElement('span'), { textContent: monster }), fight);
      this.openOptions.append(row);
    }
  }
  toggleOptions(area) {
    if (area.locked) return;
    this.openOptions.classList.toggle('d-none', this.isOpen);
    this.isOpen = !this.isOpen;
  }
}
customElements.define('combat-area-menu', CombatAreaMenuElement);
class CombatAreaMenu {
  constructor(container, areas) {
    this.container = container;
    this.menuElems = new Map();
    areas.forEach((area) => {
      const element = new CombatAreaMenuElement();
      element.className = 'col-12 col-md-6 col-xl-4';
      this.container.append(element);
      element.setArea(area);
      this.menuElems.set(area, element);
    });
  }
  open() { this.container.classList.remove('d-none'); }
  close() { this.container.classList.add('d-none'); }
}
class CombatAreaMenuManager {
  constructor() { this.all = new Map(); }
  init(categories, categoryMenu) {
    this.categoryMenu = categoryMenu;
    let insertPoint = categoryMenu;
    categories.forEach((category) => {
      const container = document.createElement('div');
      container.className = 'row row-deck gutters-tiny mt-3 d-none';
      this.all.set(category, new CombatAreaMenu(container, category.areas));
      insertPoint.insertAdjacentElement('afterend', container);
      insertPoint = container;
    });
  }
  closeOpen() {
    if (this.open === undefined) return;
    this.all.get(this.open).close();
    this.categoryMenu.unhighlightOption(this.open);
    this.open = undefined;
  }
  toggleCategory(category) {
    const wasOpen = this.open === category;
    this.closeOpen();
    if (!wasOpen) {
      this.all.get(category).open();
      this.categoryMenu.highlightOption(category);
      this.open = category;
    }
  }
}
const attackStyles = [['melee', 'Stab'], ['melee', 'Slash'], ['melee', 'Block'], ['ranged', 'Accurate'], ['ranged', 'Rapid'], ['magic', 'Magic'], ['magic', 'Defensive']].map(([attackType, name]) => ({ attackType, name, buttonID: `${name}-attack-style-button` }));
const stylePlayer = {
  attackType: 'melee', style: 'Stab', picks: [],
  setAttackStyle(style) { this.picks.push(style.name); this.style = style.name; this.renderAttackStyle(); },
  renderAttackStyle() {
    for (const type of ['melee', 'ranged', 'magic']) document.getElementById(`${type}-attack-style-buttons`).classList.toggle('d-none', type !== this.attackType);
    for (const style of attackStyles) {
      const button = document.getElementById(style.buttonID);
      button.classList.toggle('btn-secondary', style.name === this.style);
      button.classList.toggle('btn-outline-secondary', style.name !== this.style);
    }
  },
};
for (const style of attackStyles) {
  const button = Object.assign(document.createElement('button'), { className: 'btn btn-outline-secondary my-1', id: style.buttonID });
  button.style.width = '100%';
  button.append(Object.assign(document.createElement('img'), { className: 'nav-img', src: `/mod/icon.png?${style.name}` }), Object.assign(document.createElement('span'), { textContent: style.name }));
  button.onclick = () => stylePlayer.setAttackStyle(style);
  document.getElementById(`${style.attackType}-attack-style-buttons`).appendChild(Object.assign(document.createElement('div'), { className: 'col-6 col-lg-12' })).appendChild(button);
}
stylePlayer.renderAttackStyle();
const controlledPicks = [];
const addControlled = (name) => {

  check('pressing it scrolls the enemy panel up under the sticky header',  Math.abs(box(document.getElementById('combat-fight-container-enemy')).top - box(document.getElementById('page-header')).height) < 3 && cornerScrolls.at(-1).behavior === 'smooth', `${box(document.getElementById('combat-fight-container-enemy')).top}`);
} else {
  check('on a wide screen, where the enemy sits beside you, there is no Scroll to Combat button', !shown(cornerFightButton()), innerWidth);
}
window.game.golbinRaid = { isActive: true };

check('none in a Golbin Raid', !shown(cornerFightButton()));
delete window.game.golbinRaid;
stopFighting();
render();
check('and it goes once the fight ends', !shown(cornerFightButton()));

check('Scroll to Combat after picking an enemy is on by default', settingConfigs['scroll-on-area-fight'].default === true);
const pickCard = cardsOf(1)[0];
const pickFight = pickCard.querySelector('.area-fight');
pickFight.onclick = (event) => {
  event.stopPropagation();
  fightTo(farmlands, chicken);
};
realScroll(0, 0);

await new Promise((resolve) => setTimeout(resolve, 100));

render();
check('Melvor keeps the switch on when it is turned on', melvorAccepts(settingConfigs['scroll-on-area-fight'].onChange(true, false)));
settingConfigs['compact-area-select'].onChange(true, false);
shownOptions()[1].link.click();
render();
realScroll(0, 0);
pickFight.click();
await new Promise((resolve) => setTimeout(resolve, 100));
check('on, starting a fight from an area card scrolls down to it, even though Melvor\'s Fight button stops its click from bubbling', cornerScrolls.length === pickScrollsBefore + 1 && cornerScrolls.at(-1).behavior === 'smooth' && Math.abs(box(document.getElementById('combat-fight-container-enemy')).top - box(document.getElementById('page-header')).height) < 3, `${cornerScrolls.length - pickScrollsBefore} ${box(document.getElementById('combat-fight-container-enemy')).top}`);
check('with Compact Area Select on, the area list closes first, so the fight lands right under the header', combatAreaMenus.open === undefined);
pickFight.click();
await new Promise((resolve) => setTimeout(resolve, 100));
check('pressing Fight on the enemy you are already fighting does not scroll again', cornerScrolls.length === pickScrollsBefore + 1);
stopFighting();
render();
shownOptions()[1].link.click();
render();
pickCard.openButton.click();
await new Promise((resolve) => setTimeout(resolve, 100));
check('opening or closing an area card without starting a fight does not scroll', cornerScrolls.length === pickScrollsBefore + 1);
shownOptions()[1].link.click();
render();
settingConfigs['compact-area-select'].onChange(false, true);
check('Melvor keeps the switch off when it is turned off', melvorAccepts(settingConfigs['scroll-on-area-fight'].onChange(false, true)));
window.scrollTo = realScroll;
window.scrollTo(0, 0);
check('Melvor keeps the switch off when it is turned off', melvorAccepts(settingConfigs['combat-menu-buttons'].onChange(false, true)));
check('turned off, the buttons go away', !shown(cornerStack()));
check('Melvor keeps it on when it is turned back on', melvorAccepts(settingConfigs['combat-menu-buttons'].onChange(true, false)));
check('and they are back', shown(cornerStack()));
settingValues['combat-menu-buttons'] = false;
hooks.character();
check('a switch saved as off hides them once the character loads', !shown(cornerStack()));
settingValues['combat-menu-buttons'] = false;
hooks.character();
const hpBars = () => [document.getElementById('combat-player-hitpoints-bar').parentElement, document.getElementById('combat-enemy-hitpoints-bar').parentElement];
const attackTimers = () => ['player-timers', 'enemy-timers'].map((id) => document.getElementById(id));
const keptHp = () => ['combat-player-splash-container', 'combat-enemy-splash-container', 'combat-player-hitpoints-current', 'combat-enemy-hitpoints-current'].map((id) => document.getElementById(id));

check('hiding the HP bars is off by default, so both bars and both attack intervals show', settingConfigs['hide-hp-bars'].default === false && hpBars().every(shown) && attackTimers().every(shown));

check('a character that never touched them gets Jump To Last, the corner buttons, scrolling after picking an enemy and Compact Area Select on', ['mobile-combat-jump-on', 'mobile-combat-corner-on', 'mobile-combat-fight-scroll-on', 'mobile-combat-area-grid-on'].every((name) => document.body.classList.contains(name)), document.body.className);
